<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="barA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6EC8FA"/>
      <stop offset="100%" stop-color="#43ACF2"/>
