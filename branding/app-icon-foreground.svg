          d="M512,112
             C784,112 912,240 912,512
             C912,784 784,912 512,912
             C240,912 112,784 112,512
             C112,240 240,112 512,112 Z"/>

    <g transform="translate(512 512)">
      <g transform="rotate(-45)">
        <rect x="-215" y="-139" width="430" height="93" rx="8" fill="url(#barA)"/>
        <rect x="-215" y="46" width="430" height="93" rx="8" fill="url(#barA)"/>
      </g>
      <g transform="rotate(45)">
        <rect x="-215" y="-139" width="430" height="93" rx="8" fill="url(#barB)"/>
        <rect x="-215" y="46" width="430" height="93" rx="8" fill="url(#barB)"/>
