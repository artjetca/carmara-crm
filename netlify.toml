[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/api/customers/search"
  to = "/.netlify/functions/customers-search"
  status = 200

[[redirects]]
  from = "/api/visit-notes/transcribe"
  to = "/.netlify/functions/visit-notes-transcribe"
  status = 200

[[redirects]]
  from = "/api/visit-notes/structure"
  to = "/.netlify/functions/visit-notes-structure"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Note: Netlify scheduled functions are not available on free plan
# Use manual trigger or implement with external cron service

# Environment variables for production
# Set these in Netlify dashboard (no values here for security):
# Local dev: vite + functions together (netlify dev)
[dev]
  command = "/usr/local/bin/node node_modules/vite/bin/vite.js --port 5173 --host 0.0.0.0"
  targetPort = 5173
  port = 8888
  autoLaunch = false
